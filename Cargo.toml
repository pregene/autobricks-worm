[package]
name = "autobricks-worm"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Appendable WORM policy core with immutable records and creation-based retention"
publish = false

[[bin]]
name = "ab-worm"
path = "src/main.rs"

[dependencies]

[features]
macos-fuse = ["fuser/libfuse"]

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.16.0", default-features = false }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
fuser = { version = "=0.16.0", default-features = false, optional = true }
libc = "0.2"
