[package]
name = "autobricks-worm"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Appendable WORM policy core with immutable records and creation-based retention"
publish = false

[[bin]]
name = "ab-worm"
path = "src/main.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.16.0", default-features = false }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
